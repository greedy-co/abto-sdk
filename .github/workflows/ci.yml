name: sdk
run-name: ${{ github.event_name == 'workflow_dispatch' && format('recover {0}', inputs.release_tag) || github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
      - "release-candidate/**"
      - "release-recovery/**"
    tags:
      - "event-js-v*"
      - "calling-js-v*"
      - "calling-python-v*"
      - "dart-v*"
      - "android-v*"
      - "swift-v*"
      - "v*"
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SDK tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      event_js: ${{ steps.paths.outputs.event_js }}
      calling_js: ${{ steps.paths.outputs.calling_js }}
      python: ${{ steps.paths.outputs.python }}
      dart: ${{ steps.paths.outputs.dart }}
      android: ${{ steps.paths.outputs.android }}
      swift: ${{ steps.paths.outputs.swift }}
      actions: ${{ steps.paths.outputs.actions }}
      sdk: ${{ steps.paths.outputs.sdk }}
      agent_skill: ${{ steps.paths.outputs.agent_skill }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: paths
        name: Select only affected SDK checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          changed_paths=""
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            :
          elif [[ "${GITHUB_REF}" == refs/heads/release-recovery/* ]]; then
            :
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node .github/scripts/classify-sdk-changes.mjs \
              --release-tag "${GITHUB_REF_NAME}" \
              >> "${GITHUB_OUTPUT}"
            exit 0
          else
            base_sha="${BASE_SHA}"
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] \
              || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null
            then
              base_sha="$(git rev-parse "${GITHUB_SHA}^")"
            fi
            changed_paths="$(git diff --no-renames --name-only "${base_sha}" "${GITHUB_SHA}")"
          fi

          printf '%s\n' "${changed_paths}" \
            | node .github/scripts/classify-sdk-changes.mjs \
            >> "${GITHUB_OUTPUT}"

  public-safety:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Reject committed credentials
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --no-banner
          --redact
          --exit-code 1

  agent-skill:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.agent_skill == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx --yes skills@1.5.20 add . --skill abto --list
      - run: >-
          npx --yes skills@1.5.20 add .
          --skill abto
          --global
          --agent codex
          --copy
          --yes
      - run: test -f "$HOME/.agents/skills/abto/SKILL.md"
      - run: >-
          npx --yes skills@1.5.20 add .
          --skill abto
          --global
          --agent claude-code
          --copy
          --yes
      - run: test -f "$HOME/.claude/skills/abto/SKILL.md"

  event-js:
    needs: changes
    if: needs.changes.outputs.event_js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/browser/javascript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  calling-js:
    needs: changes
    if: needs.changes.outputs.calling_js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/server/javascript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  npm-release:
    needs: public-safety
    if: >-
      always()
      && needs.public-safety.result == 'success'
      && (
        (
          github.event_name == 'push'
          && github.ref_type == 'tag'
          && (
            startsWith(github.ref_name, 'event-js-v')
            || startsWith(github.ref_name, 'calling-js-v')
          )
        )
        || (
          github.event_name == 'workflow_dispatch'
          && (
            startsWith(inputs.release_tag, 'event-js-v')
            || startsWith(inputs.release_tag, 'calling-js-v')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: release-source
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          sparse-checkout: .github/scripts/check-npm-release.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: release
        name: Validate the public npm release tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          release_tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME}}"
          case "${release_tag}" in
            event-js-v*)
              target_directory="packages/browser/javascript"
              package_name="@abto-app/event"
              version="${release_tag#event-js-v}"
              ;;
            calling-js-v*)
              target_directory="packages/server/javascript"
              package_name="@abto-app/calling"
              version="${release_tag#calling-js-v}"
              ;;
            *)
              echo "::error::unsupported npm release tag ${release_tag}"
              exit 1
              ;;
          esac
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid npm release version ${version}"
            exit 1
          fi
          package_version="$(node -p "require('./release-source/${target_directory}/package.json').version")"
          if [[ "${package_version}" != "${version}" ]]; then
            echo "::error::${target_directory} is ${package_version}, expected ${version}"
            exit 1
          fi
          {
            echo "target_directory=${target_directory}"
            echo "package_name=${package_name}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
      - run: npm install --global npm@11.18.0
      - name: Require the immutable release dependency lock
        run: test -f package-lock.json
        working-directory: release-source/${{ steps.release.outputs.target_directory }}
      - run: npm ci --ignore-scripts
        working-directory: release-source/${{ steps.release.outputs.target_directory }}
      - run: npm test
        working-directory: release-source/${{ steps.release.outputs.target_directory }}
      - run: npm run typecheck
        working-directory: release-source/${{ steps.release.outputs.target_directory }}
      - run: npm run build
        working-directory: release-source/${{ steps.release.outputs.target_directory }}
      - id: registry-state
        name: Verify an existing same-version npm artifact
        run: >-
          node release-tooling/.github/scripts/check-npm-release.mjs
          "release-source/${{ steps.release.outputs.target_directory }}"
          "${{ steps.release.outputs.package_name }}"
          "${{ steps.release.outputs.version }}"
          >> "${GITHUB_OUTPUT}"
      - if: ${{ steps.registry-state.outputs.already_published != 'true' }}
        run: npm publish --access public
        working-directory: release-source/${{ steps.release.outputs.target_directory }}

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/server/python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build pytest
      - run: python -m pytest
      - run: python -m build

  dart:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/mobile/dart
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
      - run: dart pub get
      - run: dart test

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          gradle-version: "9.3.0"
      - run: >-
          gradle -p packages/mobile/android clean check sdkChecks
          generatePomFileForMavenPublication --no-daemon --no-configuration-cache

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: swift build --target AbtoApp -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - run: swift run abto-sdk-checks

  codeql-actions:
    name: Analyze (actions)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: /language:actions

  codeql-swift:
    name: Analyze (swift)
    needs: changes
    if: >-
      github.event_name == 'schedule'
      || (
        needs.changes.outputs.swift == 'true'
        && github.ref_type != 'tag'
      )
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: swift
          build-mode: manual
      - run: swift build --target AbtoApp -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - run: swift run abto-sdk-checks
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: /language:swift

  publish-source-tags:
    needs: [changes, public-safety, agent-skill, event-js, calling-js, python, dart, android, swift]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.sdk == 'true'
      && needs.public-safety.result == 'success'
      && needs.agent-skill.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Create immutable source tags for a verified release merge
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_RELEASE_SUBJECT: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          release_subject="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.merged_at != null))[0].title // ""')"
          if [[ -z "${release_subject}" ]]; then
            release_subject="${FALLBACK_RELEASE_SUBJECT}"
          fi

          prefix="chore(release): "
          if [[ "${release_subject}" != "${prefix}"* ]]; then
            echo "No SDK release tag requested by this main commit."
            exit 0
          fi

          release_tag="${release_subject#"${prefix}"}"
          if ! [[ "${release_tag}" =~ ^(event-js|calling-js|calling-python|dart|android|swift)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid SDK release tag ${release_tag}"
            exit 1
          fi

          tags=("${release_tag}")
          if [[ "${release_tag}" == swift-v* ]]; then
            tags+=("v${release_tag#swift-v}")
          fi

          git fetch --tags --force origin
          for tag in "${tags[@]}"; do
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              tagged_commit="$(git rev-list -n 1 "${tag}")"
              if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
                echo "::error::${tag} already points to ${tagged_commit}, not ${GITHUB_SHA}"
                exit 1
              fi
              continue
            fi
            git tag -a "${tag}" "${GITHUB_SHA}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          done

  source-release:
    needs: [changes, public-safety, agent-skill, event-js, calling-js, npm-release, python, dart, android, swift]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref_type == 'tag'
      && (
        startsWith(github.ref_name, 'event-js-v')
        || startsWith(github.ref_name, 'calling-js-v')
        || startsWith(github.ref_name, 'calling-python-v')
        || startsWith(github.ref_name, 'dart-v')
        || startsWith(github.ref_name, 'android-v')
        || startsWith(github.ref_name, 'swift-v')
        || startsWith(github.ref_name, 'v')
      )
      && needs.public-safety.result == 'success'
      && needs.agent-skill.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          || gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --generate-notes

  recover-source-release:
    needs: [public-safety, npm-release]
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.public-safety.result == 'success'
      && (
        startsWith(inputs.release_tag, 'calling-python-v')
        || startsWith(inputs.release_tag, 'dart-v')
        || startsWith(inputs.release_tag, 'android-v')
        || startsWith(inputs.release_tag, 'swift-v')
        || startsWith(inputs.release_tag, 'v')
        || (
          needs.npm-release.result == 'success'
          && (
            startsWith(inputs.release_tag, 'event-js-v')
            || startsWith(inputs.release_tag, 'calling-js-v')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require successful source CI for a non-npm recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          case "${RELEASE_TAG}" in
            event-js-v*|calling-js-v*) exit 0 ;;
          esac
          tagged_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
              --jq .sha
          )"
          successful_run="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --branch "${RELEASE_TAG}" \
              --event push \
              --limit 20 \
              --json conclusion,headSha \
            | jq -r \
                --arg sha "${tagged_sha}" \
                'any(.[]; .headSha == $sha and .conclusion == "success")'
          )"
          if [[ "${successful_run}" != "true" ]]; then
            echo "::error::${RELEASE_TAG} has no successful source CI run"
            exit 1
          fi
      - name: Recover an existing verified source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release view "${RELEASE_TAG}"
          --repo "${GITHUB_REPOSITORY}"
          || gh release create "${RELEASE_TAG}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "${RELEASE_TAG}"
          --generate-notes

  recover-source-release-from-branch:
    needs: public-safety
    if: >-
      always()
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/release-recovery/')
      && needs.public-safety.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recover an existing verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          recovery_path="${GITHUB_REF#refs/heads/release-recovery/}"
          release_tag="${recovery_path%%/*}"
          case "${release_tag}" in
            calling-python-v*|dart-v*|android-v*|swift-v*|v*) ;;
            *)
              echo "::error::unsupported source release recovery tag ${release_tag}"
              exit 1
              ;;
          esac
          version="${release_tag##*-v}"
          if [[ "${release_tag}" == v* ]]; then
            version="${release_tag#v}"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid source release recovery version ${version}"
            exit 1
          fi

          main_relationship="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" \
              --jq .status
          )"
          if [[ "${main_relationship}" != "identical" && "${main_relationship}" != "ahead" ]]; then
            echo "::error::release recovery branch must point to public main history, not ${GITHUB_SHA}"
            exit 1
          fi
          tagged_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)"
          successful_run="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --branch "${release_tag}" \
              --event push \
              --limit 20 \
              --json conclusion,headSha \
            | jq -r \
                --arg sha "${tagged_sha}" \
                'any(.[]; .headSha == $sha and .conclusion == "success")'
          )"
          if [[ "${successful_run}" != "true" ]]; then
            echo "::error::${release_tag} has no successful source CI run"
            exit 1
          fi

          gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" \
            || gh release create "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${release_tag}" \
              --generate-notes
